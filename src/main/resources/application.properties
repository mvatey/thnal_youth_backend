spring.application.name=thnal_youth_backend

# Load values from the .env file in the project root
spring.config.import=optional:file:${user.dir}/.env[.properties]

spring.docker.compose.enabled=false


# ============================================================
# SERVER
# ============================================================

server.port=8081


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/thnal_youth_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Environment-variable version
# spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
# spring.datasource.username=${POSTGRES_USER}
# spring.datasource.password=${POSTGRES_PASSWORD}


# ============================================================
# JPA
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never


# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}


# ============================================================
# FILE UPLOAD
# ============================================================

# Folder where uploaded files are stored.
# This creates/uses an "uploads" folder in the project directory.
app.file.upload-dir=uploads

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# EMAIL OTP
# ============================================================

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Prevent requests from hanging too long
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM}


# ============================================================
# PLASGATE SMS
# ============================================================

plasgate.base-url=${PLASGATE_BASE_URL}
plasgate.private-key=${PLASGATE_PRIVATE_KEY}
plasgate.secret-key=${PLASGATE_SECRET_KEY}
plasgate.sender=${PLASGATE_SENDER}