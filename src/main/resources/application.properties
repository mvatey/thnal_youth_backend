app.file.base-url=${FILE_BASE_URL:http://localhost:8081/uploads}

# Where uploaded files (profile photos, documents, certificates) are
# physically stored. "local" (default) writes directly to this server's
# own disk -- the option for deploying anywhere that isn't AWS, and needs
# no cloud credentials at all. "s3" uses AWS S3 instead; on an AWS
# instance with an attached IAM role it needs no access keys either, but
# off AWS you'd have to add AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY env
# vars yourself. The live AWS deployment sets STORAGE_TYPE=s3 explicitly
# as its own environment variable, so this default only affects a fresh
# clone/fork that hasn't set STORAGE_TYPE at all -- it does not change
# what that environment does. See FileStorage/S3FileStorage/
# LocalDiskFileStorage.
app.storage.type=${STORAGE_TYPE:local}

# Only read when app.storage.type=s3.
app.storage.s3.bucket=${S3_BUCKET_NAME}
app.storage.s3.region=${S3_REGION:ap-southeast-1}

# Only read when app.storage.type=local. Must be a path that survives
# redeploys/restarts on this server (a dedicated data directory/volume --
# not wherever the deploy process wipes and re-extracts the app into).
app.storage.local.root-dir=${LOCAL_STORAGE_ROOT_DIR:./uploads}

spring.application.name=tnal_youth_backend

# Comma-separated browser origins allowed to call the API directly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.config.import=optional:file:.env[.properties]

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8081

# Default max is 200 threads, each reserving its own stack -- far more
# than this app's realistic concurrent usage needs, and a meaningful
# chunk of the memory headroom on Railway's 1GB container limit.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:5}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Spring Boot's own multipart defaults (max-file-size=1MB, max-request-size
# =10MB) are never overridden anywhere else in this app, so they silently
# sit UNDER FileServiceImpl's actual intended ceilings (MAX_ATTACHMENT_SIZE
# = 50MB, and up to 10 files per gallery upload request) -- any activity
# attachment/document over 1MB would be rejected by the servlet layer
# before ever reaching that code's own (already sane) 50MB check. Raised
# here so the app's real limits are what actually govern, not an invisible
# smaller one underneath them. max-file-size=100MB also covers the profile
# photo upload's own advertised cap (see memberInfoCard.js); a request
# exceeding either throws MaxUploadSizeExceededException, which
# GlobalExceptionHandler turns into a proper 413 + JSON message instead of
# a raw error page.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration



# ============================================================
# EMAIL (OTP + notifications)
# ============================================================
# Sent via plain SMTP (JavaMailSender) through Gmail -- MAIL_USERNAME must
# be the Gmail account these credentials authenticate as, and MAIL_FROM
# should normally match it exactly (Gmail's SMTP relay rejects or rewrites
# a From address that isn't the authenticated account or one of its
# verified "Send mail as" aliases). Previously routed through Resend's
# HTTP API instead, because Railway blocked outbound SMTP ports
# (25/465/587/2525) below its Pro plan -- no longer a constraint now that
# the backend runs on AWS Elastic Beanstalk.

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Prevent requests from hanging too long
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# PLASGATE SMS
# Plasgate SMS
plasgate.base-url=${PLASGATE_BASE_URL}
plasgate.private-key=${PLASGATE_PRIVATE_KEY}
plasgate.secret-key=${PLASGATE_SECRET_KEY}
plasgate.sender=${PLASGATE_SENDER}



# ============================================================
# TELEGRAM + OUT-OF-APP NOTIFICATIONS
# ============================================================
# Values come from the project-root .env imported above.
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
# TelegramPollingScheduler vs TelegramWebhookController — Telegram allows
# only one active at a time. Polling needs no public URL, so it's the
# right default everywhere until a real HTTPS webhook is registered with
# Telegram (setWebhook) for a production deployment; set this to false
# only once that's done.
app.telegram.polling-enabled=${TELEGRAM_POLLING_ENABLED:true}
app.notification.base-url=${APP_NOTIFICATION_BASE_URL:http://localhost:3000}

