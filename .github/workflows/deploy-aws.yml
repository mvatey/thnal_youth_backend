name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - aws-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Upload JAR to S3
        run: |
          aws s3 cp target/tnal_youth_backend-0.0.1-SNAPSHOT.jar \
            "s3://elasticbeanstalk-ap-southeast-1-732837096104/tnal-youth-backend-${{ github.sha }}.jar"

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name tnal-youth-backend \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="elasticbeanstalk-ap-southeast-1-732837096104",S3Key="tnal-youth-backend-${{ github.sha }}.jar"

      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name tnal-youth-prod \
            --version-label "${{ github.sha }}"

      - name: Wait for deployment to finish
        run: |
          until [ "$(aws elasticbeanstalk describe-environments \
            --environment-names tnal-youth-prod \
            --query 'Environments[0].Status' --output text)" == "Ready" ]; do
            echo "Waiting for environment to become Ready..."
            sleep 15
          done

          HEALTH=$(aws elasticbeanstalk describe-environments \
            --environment-names tnal-youth-prod \
            --query 'Environments[0].Health' --output text)

          echo "Final health: $HEALTH"

          if [ "$HEALTH" != "Green" ]; then
            echo "::warning::Environment health is $HEALTH, not Green -- check the AWS console."
          fi
