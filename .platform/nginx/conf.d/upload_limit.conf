# Nginx's own default (1MB) was rejecting profile-photo uploads before they
# ever reached Spring Boot. Set this a bit ABOVE Spring's own configured
# ceiling (spring.servlet.multipart.max-request-size in
# application.properties, currently 110MB for a 100MB file) so nginx is
# never the layer that rejects an oversized upload -- Spring's own
# MaxUploadSizeExceededException handler is what should reject it, since
# that returns a proper JSON error the frontend can actually parse and show
# to the user, instead of a bare nginx 413 HTML page.
client_max_body_size 120m;
