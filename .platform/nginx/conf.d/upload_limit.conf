# Nginx's own default (1MB) was rejecting profile-photo uploads before they
# ever reached Spring Boot -- which already allows up to 50MB
# (spring.servlet.multipart.max-file-size in application.properties). Raise
# nginx's cap so it isn't the tighter of the two; keep it below Spring's
# ceiling so a request that's too big still gets Spring's own error message
# instead of a bare nginx 413.
client_max_body_size 10m;
